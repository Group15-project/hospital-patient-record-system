<html lang="en">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<aside class="sidebar">

    <div class="logo">
        <h2>MediCare</h2>
    </div>

    <nav class="menu">

        <ul>
            <li class="dashboard-menu"><a href="dashboard.html">Dashboard</a></li>

        </ul>

    </nav>

    <div class="logout">
        <a href="index.html">Logout</a>
    </div>

</aside>

<main class="main-content">

    <header class="topbar">
        <div>
            <h1>Patients Management</h1>
            <p>Register and manage patient records</p>
        </div>
    </header>

    <!-- Registration Form -->
   <!-- Registration Form -->
<section class="form-card">

    <h2>Register New Patient</h2>

    <form id="patientForm" class="patient-form">

        <div class="grid">

            <div>
                <label>First Name</label>
                <input
                    id="firstName"
                    type="text"
                    placeholder="John"
                    required
                >
            </div>

            <div>
                <label>Last Name</label>
                <input
                    id="lastName"
                    type="text"
                    placeholder="Doe"
                    required
                >
            </div>

            <div>
                <label>Date of Birth</label>
                <input
                    id="dateOfBirth"
                    type="date"
                >
            </div>

            <div>
                <label>Gender</label>
                <select
                    id="gender"
                    required
                >
                    <option value="">
                        Select Gender
                    </option>
                    <option value="Male">
                        Male
                    </option>
                    <option value="Female">
                        Female
                    </option>
                </select>
            </div>

            <div>
                <label>Phone Number</label>
                <input
                    id="phone"
                    type="tel"
                    placeholder="08012345678"
                >
            </div>

            <div>
                <label>Email</label>
                <input
                    id="email"
                    type="email"
                    placeholder="john@example.com"
                >
            </div>

            <div>
                <label>Emergency Contact Name</label>
                <input
                    id="emergencyName"
                    type="text"
                    placeholder="Jane Doe"
                >
            </div>

            <div>
                <label>Emergency Contact Phone</label>
                <input
                    id="emergencyPhone"
                    type="tel"
                    placeholder="08087654321"
                >
            </div>

            <div>
                <label>Blood Group</label>
                <select id="bloodGroup">
                    <option value="">
                        Select Blood Group
                    </option>
                    <option value="A+">A+</option>
                    <option value="A-">A-</option>
                    <option value="B+">B+</option>
                    <option value="B-">B-</option>
                    <option value="AB+">AB+</option>
                    <option value="AB-">AB-</option>
                    <option value="O+">O+</option>
                    <option value="O-">O-</option>
                </select>
            </div>

        </div>

        <div class="full-width">
            <label>Address</label>
            <textarea
                id="address"
                rows="4"
            ></textarea>
        </div>

        <button
            type="submit"
            class="primary-btn"
        >
            Save Patient
        </button>

    </form>

</section>

    <!-- Patient List -->

    <section class="table-section">

        <div class="table-header">
            <h2>Patient Records</h2>

            <input
                type="search"
                class="search-input"
                placeholder="Search patient..."
            >
        </div>

        <table>

            <thead>
                <tr>
                    <th>ID</th>
                    <th>Full Name</th>
                    <th>Gender</th>
                    <th>Phone</th>
                    <th>Actions</th>
                </tr>
            </thead>

           <tbody id="patientsTableBody"></tbody>

        </table>

    </section>

</main>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/patients.js"></script>

<script>
    requireAuth();
</script>

</body>
</html>
