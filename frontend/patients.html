    <main class="main-content">
      <header class="topbar">
        <div>
          <h1>Patients Management</h1>
          <p>Register and manage patient records</p>
        </div>
      </header>

      <!-- Registration Form -->

      <!-- Registration Form -->
      <!-- Registration Form -->
      <section class="form-card">
        <h2>Register New Patient</h2>

        <form id="patientForm" class="patient-form">
          <div class="grid">
            <div>
              <label for="firstName">First Name</label>
              <input id="firstName" type="text" required />
            </div>

            <div>
              <label for="lastName">Last Name</label>
              <input id="lastName" type="text" required />
            </div>

            <div>
              <label for="dateOfBirth">Date of Birth</label>
              <input id="dateOfBirth" type="date" required />
            </div>

            <div>
              <label for="gender">Gender</label>
              <select id="gender" required>
                <option value="">Select Gender</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
              </select>
            </div>

            <div>
              <label for="phone">Phone Number</label>
              <input id="phone" type="tel" placeholder="08012345678" />
            </div>

            <div>
              <label for="email">Email</label>
              <input id="email" type="email" placeholder="example@email.com" />
            </div>

            <div>
              <label for="emergencyName">Emergency Contact Name</label>
              <input id="emergencyName" type="text" />
            </div>

            <div>
              <label for="emergencyPhone">Emergency Contact Phone</label>
              <input id="emergencyPhone" type="tel" placeholder="08012345678" />
            </div>

            <div>
              <label for="bloodGroup">Blood Group</label>
              <select id="bloodGroup">
                <option value="">Select Blood Group</option>
                <option value="A+">A+</option>
                <option value="A-">A-</option>
                <option value="B+">B+</option>
                <option value="B-">B-</option>
                <option value="AB+">AB+</option>
                <option value="AB-">AB-</option>
                <option value="O+">O+</option>
                <option value="O-">O-</option>
              </select>
            </div>
            <div>
              <label for="allergyInput">
                  Allergies
              </label>

              <div class="allergy-wrapper">
                <input
                    type="text"
                    id="allergyInput"
                    placeholder="Enter allergy">

                <button
                    type="button"
                    class="add-allergy-btn">
                    Add
                </button>

              </div>

              <div id="allergyList"></div>

            </div>
          <div class="full-width">
            <label for="address">Address</label>
            <textarea id="address" rows="4"></textarea>
          </div>

          <div class="grid">
              
          </div>

          <button type="submit" class="save-btn">
              Save Patient
          </button>        
        </form>
      </section>

      <!-- Patient List -->

      <section class="table-section">
        <div class="table-header">
          <h2>Patient Records</h2>

          <input
            type="search"
            class="search-input"
            placeholder="Search patient..."
          />
        </div>

        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Full Name</th>
              <th>Gender</th>
              <th>Phone</th>
              <th>Actions</th>
            </tr>
          </thead>

          <tbody id="patientsTableBody"></tbody>
        </table>
      </section>
    </main>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>

    <script>
      requireAuth();
      applyRolePermissions();
    </script>
