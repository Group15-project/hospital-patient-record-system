<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MediCare - Forgot Password</title>
    <link rel="icon" type="image/png" href="assets/favicon.png" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            min-height: 100vh;
            background-image: url('https://images.unsplash.com/photo-1538108149393-fbbd81895907?w=1600&q=80');
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(26, 86, 219, 0.6);
            z-index: 0;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 440px;
            position: relative;
            z-index: 1;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
        }

        .logo { font-size: 1.4rem; font-weight: 700; color: #1a56db; margin-bottom: 24px; }
        .logo span { color: #0891b2; }

        h1 { font-size: 1.6rem; font-weight: 700; color: #1e3a5f; margin-bottom: 8px; }
        .subtitle { font-size: 0.95rem; color: #64748b; margin-bottom: 28px; line-height: 1.6; }

        .icon-box {
            width: 64px; height: 64px;
            background: #eff6ff;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.8rem;
            margin-bottom: 20px;
        }

        label { display: block; font-size: 0.9rem; font-weight: 600; color: #374151; margin-bottom: 6px; }

        input {
            width: 100%; padding: 12px 16px;
            border: 1.5px solid #e2e8f0;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
            transition: border 0.2s;
            margin-bottom: 20px;
        }

        input:focus { border-color: #1a56db; }

        .btn {
            width: 100%; padding: 14px;
            background: #1a56db;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            margin-bottom: 16px;
        }

        .btn:hover { background: #1344b0; }

        .back-link {
            display: block;
            text-align: center;
            color: #1a56db;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div class="overlay"></div>

    <div class="card">
        <div class="logo">Medi<span>Care</span></div>
        <div class="icon-box">🔑</div>
        <h1>Forgot Password?</h1>
        <p class="subtitle">No worries! Enter your email address and we'll send you a link to reset your password.</p>

        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="Enter your email address" />

        <button class="btn">Send Reset Link</button>
        <a href="login.html" class="back-link">← Back to Login</a>
    </div>

</body>
</html>
