<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MediCare - Reports & Analysis</title>
    <link rel="icon" type="image/png" href="assets/favicon.png" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #f8faff; color: #1a1a2e; }

        nav { display: flex; justify-content: space-between; align-items: center; padding: 16px 40px; background: #1a56db; }
        .logo { color: white; font-size: 1.4rem; font-weight: 700; }
        .logo span { color: #93c5fd; }
        .nav-links { display: flex; gap: 20px; list-style: none; align-items: center; }
        .nav-links a { color: rgba(255,255,255,0.85); text-decoration: none; font-size: 0.9rem; }
        .nav-links .btn { background: white; color: #1a56db; padding: 8px 18px; border-radius: 20px; font-weight: 600; }

        .hero { background: linear-gradient(135deg, #1a56db, #0891b2); color: white; padding: 50px 40px; }
        .hero h1 { font-size: 2rem; font-weight: 800; margin-bottom: 8px; }
        .hero p { opacity: 0.9; font-size: 1rem; }

        .stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; padding: 30px 40px; }
        .stat-card { background: white; border: 1px solid #e2e8f0; border-radius: 14px; padding: 24px; text-align: center; }
        .stat-card .icon { font-size: 2rem; margin-bottom: 10px; }
        .stat-card h2 { font-size: 1.8rem; font-weight: 800; color: #1a56db; }
        .stat-card p { font-size: 0.85rem; color: #64748b; margin-top: 4px; }

        .section { padding: 20px 40px 50px; }
        .section h2 { font-size: 1.4rem; font-weight: 700; color: #1e3a5f; margin-bottom: 20px; }

        .charts { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-bottom: 30px; }
        .chart-card { background: white; border: 1px solid #e2e8f0; border-radius: 14px; padding: 24px; }
        .chart-card h3 { font-size: 1rem; font-weight: 600; color: #1e3a5f; margin-bottom: 16px; }

        .bar-chart { display: flex; align-items: flex-end; gap: 12px; height: 160px; padding-top: 10px; }
        .bar-wrap { display: flex; flex-direction: column; align-items: center; flex: 1; gap: 6px; }
        .bar { width: 100%; border-radius: 6px 6px 0 0; background: #1a56db; transition: opacity 0.2s; }
        .bar:hover { opacity: 0.8; }
        .bar-label { font-size: 0.75rem; color: #64748b; }
        .bar-value { font-size: 0.75rem; font-weight: 600; color: #1e3a5f; }

        .donut-wrap { display: flex; align-items: center; gap: 24px; }
        .donut { width: 120px; height: 120px; border-radius: 50%; background: conic-gradient(#1a56db 0% 45%, #0891b2 45% 70%, #10b981 70% 85%, #f59e0b 85% 100%); display: flex; align-items: center; justify-content: center; position: relative; }
        .donut-inner { width: 70px; height: 70px; background: white; border-radius: 50%; }
        .legend { display: flex; flex-direction: column; gap: 8px; }
        .legend-item { display: flex; align-items: center; gap: 8px; font-size: 0.8rem; color: #374151; }
        .dot { width: 10px; height: 10px; border-radius: 50%; }

        .table-card { background: white; border: 1px solid #e2e8f0; border-radius: 14px; padding: 24px; }
        .table-card h3 { font-size: 1rem; font-weight: 600; color: #1e3a5f; margin-bottom: 16px; }
        table { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
        th { background: #f8faff; padding: 10px 14px; text-align: left; color: #64748b; font-weight: 600; border-bottom: 1px solid #e2e8f0; }
        td { padding: 10px 14px; border-bottom: 1px solid #f1f5f9; color: #374151; }
        tr:last-child td { border-bottom: none; }
        .badge { padding: 4px 10px; border-radius: 12px; font-size: 0.75rem; font-weight: 600; }
        .badge.green { background: #dcfce7; color: #166534; }
        .badge.blue { background: #dbeafe; color: #1e40af; }
        .badge.amber { background: #fef3c7; color: #92400e; }

        .export-bar { display: flex; justify-content: flex-end; gap: 12px; margin-bottom: 20px; }
        .export-btn { padding: 10px 20px; border-radius: 8px; border: 1.5px solid #1a56db; color: #1a56db; background: white; cursor: pointer; font-size: 0.875rem; font-weight: 600; }
        .export-btn.filled { background: #1a56db; color: white; }

        footer { text-align: center; padding: 24px; background: #1e3a5f; color: rgba(255,255,255,0.6); font-size: 0.85rem; }
    </style>
</head>
