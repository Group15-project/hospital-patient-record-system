<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediCare Login</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/png" href="assets/favicon.png">    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
    .login-body {
        background-image: url('https://images.unsplash.com/photo-1538108149393-fbbd81895907?w=1600&q=80');
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
    }

    .login-left {
        background: rgba(26, 86, 219, 0.75) !important;
    }
</style>

</head>
<body class="login-body">

    <div class="login-container">

        <!-- Left Side -->

        <div class="login-left">

            <div class="brand">

                <h1>MediCare</h1>

                <p>
                    Secure Patient Record Management System
                </p>

            </div>

            <div class="hero-text">

                <h2>
                    Simplifying Healthcare Record Management
                </h2>

                <p>
                    Manage patients, appointments, medical histories,
                    and doctor notes from one secure platform.
                </p>

            </div>

        </div>

        <!-- Right Side -->

        <div class="login-right">

            <div class="login-card">

                <h2>Welcome Back</h2>

                <p>
                    Sign in to access your dashboard
                </p>

                <form>

                    <div class="form-group">
                        <label>Email Address</label>
                        <input
                            type="email"
                            placeholder="admin@medicare.com"
                        >
                    </div>

                    <div class="form-group">
                        <label>Password</label>
                        <input
                            type="password"
                            placeholder="Enter password"
                        >
                    </div>

                    <div class="login-options">

                        <label class="remember">

                            <input type="checkbox">

                            Remember Me

                        </label>

                        <a href="#">
                            Forgot Password?
                        </a>

                    </div>

                    <a href="dashboard.html" class="login-btn">
                        Login
                    </a>

                </form>

            </div>

        </div>

    </div>
    <script src="main.js"></script>

</body>
</html>
