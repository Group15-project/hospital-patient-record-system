<main class="main-content">

    <header class="topbar">
        <div>
            <h1>Doctor Notes</h1>
            <p>Clinical observations and treatment records</p>
        </div>
    </header>

    <!-- Patient Card -->

  <section class="patient-card">

    <div>
        <span>Patient ID</span>
        <h3 id="patientNumber">--</h3>
    </div>

    <div>
        <span>Patient Name</span>
        <h3 id="patientName">--</h3>
    </div>

    <div>
        <span>Age</span>
        <h3 id="patientAge">--</h3>
    </div>

    <div>
        <span>Gender</span>
        <h3 id="patientGender">--</h3>
    </div>

</section>

    <!-- Notes Form -->

    <section class="form-card">

        <h2>Add Clinical Notes</h2>

     <form id="doctorNotesForm">

    <div class="full-width">
        <label>Chief Complaint</label>
        <textarea
            id="chiefComplaint"
            rows="3"
        ></textarea>
    </div>

    <div class="full-width">
        <label>Diagnosis</label>
        <textarea
            id="diagnosis"
            rows="4"
        ></textarea>
    </div>

    <div class="full-width">
        <label>Prescription</label>
        <textarea
            id="prescription"
            rows="4"
        ></textarea>
    </div>

    <div class="full-width">
        <label>Treatment Plan</label>
        <textarea
            id="treatmentPlan"
            rows="4"
        ></textarea>
    </div>

    <div class="full-width">
        <label>Follow-up Recommendations</label>
        <textarea
            id="notes"
            rows="4"
        ></textarea>
    </div>

    <button
        type="submit"
        class="primary-btn"
    >
        Save Notes
    </button>

</form>

    </section>

    <!-- Notes History -->

   <section class="notes-history">

    <h2>Clinical History</h2>

    <div id="notesHistory">
    </div>

</section>

</main>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/doctor-notes.js"></script>

<script>
    requireAuth();
</script>
</body>
</html>
