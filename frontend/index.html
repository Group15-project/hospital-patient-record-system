<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediCare Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-body">

<div class="login-container">

    <!-- Left Side -->

    <div class="login-left">

        <div class="brand">

            <h1>MediCare</h1>

            <p>
                Secure Patient Record Management System
            </p>

        </div>

        <div class="hero-text">

            <h2>
                Simplifying Healthcare Record Management
            </h2>

            <p>
                Manage patients, appointments, medical histories,
                and doctor notes from one secure platform.
            </p>

        </div>

    </div>

    <!-- Right Side -->

    <div class="login-right">

        <div class="login-card">

            <h2>Welcome Back</h2>

            <p>
                Sign in to access your dashboard
            </p>

            <form>

                <div class="form-group">
                    <label>Email Address</label>
                    <input
                        type="email"
                        placeholder="admin@medicare.com"
                    >
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <input
                        type="password"
                        placeholder="Enter password"
                    >
                </div>

                <div class="login-options">

                    <label class="remember">

                        <input type="checkbox">

                        Remember Me

                    </label>

                    <a href="#">
                        Forgot Password?
                    </a>

                </div>

                <a href="dashboard.html" class="login-btn">
                    Login
                </a>

            </form>

        </div>

    </div>

</div>

</body>
</html>
