<main class="main-content">

    <header class="topbar">
        <div>
            <h1>Appointments</h1>
            <p>Manage patient appointments and schedules</p>
        </div>
    </header>

    <!-- Schedule Appointment -->

   <section class="form-card">

    <h2>Schedule Appointment</h2>

    <form id="appointmentForm">

        <div class="grid">

            <div>
                <label>Patient</label>

                <select id="patientSelect" required>
                    <option value="">
                        Select Patient
                    </option>
                </select>
            </div>

            <div>
                <label>Doctor</label>

                <select id="doctorSelect" required>
                    <option value="">
                        Select Doctor
                    </option>
                </select>
            </div>

            <div>
                <label>Date</label>

                <input
                    id="appointmentDate"
                    type="date"
                    required
                >
            </div>

            <div>
                <label>Time</label>

                <input
                    id="appointmentTime"
                    type="time"
                    required
                >
            </div>

            <div>
                <label>Priority</label>

                <select id="priority">
                    <option value="NORMAL">
                        Normal
                    </option>

                    <option value="URGENT">
                        Urgent
                    </option>

                    <option value="EMERGENCY">
                        Emergency
                    </option>
                </select>
            </div>

        </div>

        <div style="margin-top:20px;">

            <label>Reason</label>

            <textarea
                id="appointmentReason"
                rows="4"
                placeholder="Enter appointment reason..."
            ></textarea>

        </div>

        <button
            type="submit"
            class="primary-btn"
            style="margin-top:20px;"
        >
            Schedule Appointment
        </button>

    </form>

</section>

    <!-- Upcoming Appointments -->

    <section class="table-section">

        <div class="table-header">
            <h2>Upcoming Appointments</h2>
        </div>

        <table>

            <thead>
                <tr>
                    <th>Patient</th>
                    <th>Doctor</th>
                    <th>Date</th>
                    <th>Time</th>
                    <th>Priority</th>
                </tr>
            </thead>

     <tbody id="appointmentsTableBody">
        </tbody>
        </table>

    </section>

</main>
