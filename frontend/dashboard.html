<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hospital Patient Record System</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="logo">
        <h2>MediCare</h2>
      </div>

      <nav class="menu">
        <ul>
         <li class="dashboard-menu"><a href="dashboard.html">Dashboard</a></li>
          <li><a href="search.html">Search</a></li>
          <li><a href="patients.html">Patients</a></li>
          <!--<li><a href="patient-details.html">Patient Details</a></li>-->
          <li><a href="medical-history.html">Medical History</a></li>
          <li><a href="appointments.html">Appointments</a></li>
          <!-- <li><a href="doctor-notes.html">Doctor Notes</a></li> -->
          <li><a href="settings.html">Settings</a></li>
        </ul>
      </nav>

      <div class="logout">
        <a href="#" onclick="logout()"> Logout </a>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <!-- Top Bar -->
      <header class="topbar">
        <div>
          <h1>Dashboard</h1>
          <p>Welcome back, Administrator</p>
        </div>

        <div class="user-profile">
          <span>Admin User</span>
        </div>
      </header>

      <!-- KPI Cards -->
      <section class="cards">
        <div class="card">
          <h3>Total Patients</h3>
          <p id="totalPatients">0</p>
        </div>

        <div class="card">
          <h3>Appointments Scheduled</h3>
          <p id="appointmentsToday">0</p>
        </div>

        <div class="card">
          <h3>Doctors Available</h3>
          <p id="doctorsAvailable">0</p>
        </div>

        <div class="card">
          <h3>Emergency Cases</h3>
          <p id="emergencyCases">0</p>
        </div>
      </section>

      <!-- Patient Table -->
      <section class="table-section">
        <div class="table-header">
          <h2>Recent Patients</h2>
          <button onclick="window.location.href='patients.html'">Add Patient</button>
        </div>

        <table>
          <thead>
            <tr>
              <th>Patient ID</th>
              <th>Name</th>
              <th>Gender</th>
              <th>Phone</th>
              <th>Status</th>
            </tr>
          </thead>

          <tbody id="recentPatientsBody"></tbody>
        </table>
      </section>
    </main>
  </body>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/dashboard.js"></script>
<script>
    requireAuth();

    const user = JSON.parse(
        localStorage.getItem("user")
    );

    if (
        !user ||
        (
            user.role !== "ADMIN" &&
            user.role !== "SUPER_ADMIN"
        )
    ) {
        window.location.href =
            "patients.html";
    }
</script>
</html>
