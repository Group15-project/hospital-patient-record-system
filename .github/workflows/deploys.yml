name: Deploy Backend to Render

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'

  pull_request:
    branches:
      - main
    paths:
      - 'backend/**'

jobs:
  test-backend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: backend/go.sum

      - name: Download dependencies
        run: go mod tidy

      - name: Build application
        run: go build -v ./...

      - name: Run tests
        run: go test ./...

  deploy-render:
    if: github.event_name == 'push'
    needs: test-backend
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Backend Render Deploy
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

      - name: Wait for Render Deployment
        run: sleep 60

      - name: Health Check
        run: |
          curl --fail https://hospital-patient-record-system-7hcj.onrender.com/health